<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voter Registration</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Voter Registration System</h1>

    <nav>

        <a href="/">Home</a>

        <a href="/register">Register</a>

        <a href="/login">Login</a>

    </nav>

</header>


<main class="form-container">

    <div class="form-card">

        <h2>Voter Registration Form</h2>

        <p class="form-description">
            Enter your details to register.
        </p>


        <form id="registerForm">

            <!-- Name -->

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter full name"
                required
            >


            <!-- Age -->

            <label>Age</label>

            <input
                type="number"
                name="age"
                min="18"
                placeholder="Enter age"
                required
            >


            <!-- DOB -->

            <label>Date of Birth</label>

            <input
                type="date"
                name="dob"
                required
            >


            <!-- Gender -->

            <label>Gender</label>

            <select name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Email -->

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <!-- Mobile -->

            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile"
                pattern="[0-9]{10}"
                placeholder="Enter 10-digit mobile number"
                required
            >


            <!-- Voter ID -->

            <label>Voter ID</label>

            <input
                type="text"
                name="voterId"
                placeholder="Enter voter ID"
                required
            >


            <!-- Username -->

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Create username"
                required
            >


            <!-- Password -->

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                minlength="6"
                required
            >


            <!-- Address -->

            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter address"
                required></textarea>


            <!-- State -->

            <label>State</label>

            <input
                type="text"
                name="state"
                placeholder="Enter state"
                required
            >


            <!-- Constituency -->

            <label>Constituency</label>

            <input
                type="text"
                name="constituency"
                placeholder="Enter constituency"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <p id="registerMessage"></p>


        <p class="bottom-text">
            Already registered?
            <a href="/login">Login here</a>
        </p>

    </div>

</main>


<script src="js/script.js"></script>

</body>

</html>
