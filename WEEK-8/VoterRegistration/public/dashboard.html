<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voter Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Voter Registration System</h1>

    <nav>

        <a href="/">Home</a>

        <button id="logoutButton">
            Logout
        </button>

    </nav>

</header>


<main class="dashboard">

    <h2>Voter Dashboard</h2>

    <p class="welcome">
        Welcome, <strong id="welcomeName"></strong>
    </p>


    <section class="profile-card">

        <h3>Voter Information</h3>


        <div class="info-grid">

            <div class="info-item">
                <strong>Full Name</strong>
                <span id="name"></span>
            </div>


            <div class="info-item">
                <strong>Age</strong>
                <span id="age"></span>
            </div>


            <div class="info-item">
                <strong>Date of Birth</strong>
                <span id="dob"></span>
            </div>


            <div class="info-item">
                <strong>Gender</strong>
                <span id="gender"></span>
            </div>


            <div class="info-item">
                <strong>Email</strong>
                <span id="email"></span>
            </div>


            <div class="info-item">
                <strong>Mobile Number</strong>
                <span id="mobile"></span>
            </div>


            <div class="info-item">
                <strong>Voter ID</strong>
                <span id="voterId"></span>
            </div>


            <div class="info-item">
                <strong>Username</strong>
                <span id="username"></span>
            </div>


            <div class="info-item">
                <strong>State</strong>
                <span id="state"></span>
            </div>


            <div class="info-item">
                <strong>Constituency</strong>
                <span id="constituency"></span>
            </div>


            <div class="info-item full-width">
                <strong>Address</strong>
                <span id="address"></span>
            </div>

        </div>

    </section>


    <section class="status-card">

        <h3>Registration Status</h3>

        <p class="status">
            ✓ Registration Successful
        </p>

        <p>
            Your voter details have been successfully
            stored in the system.
        </p>

    </section>


    <button id="logoutButton2" class="logout-main">
        Logout
    </button>

</main>


<script src="js/script.js"></script>

</body>

</html>
